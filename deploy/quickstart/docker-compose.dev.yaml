services:
  start:
    image: ${START_IMAGE:-ghcr.io/norrs/start:latest}
    pull_policy: always
    container_name: start-dev
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    environment:
      STARTPAGE_BASE_URL: http://127.0.0.1:8080
      STARTPAGE_DEV_MODE: "true"
      STARTPAGE_METRICS_ENABLED: "true"
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: ["CMD", "/app/start", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
